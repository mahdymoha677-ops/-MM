name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: فك ملف المشروع
        run: |
          unzip -o TikTokMM_OFFLINE_READY.zip -d project
          cd project
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokMM-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          

