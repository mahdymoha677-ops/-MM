name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بناء APK
        run: gradle :app:assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokMM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
